schema_version: "1.0"
name: quiet-python-file
description: 'A plain Python bug.'
tags: [should-not-fire]
execution:
  prompt: >-
    My Python script that reads config.json raises FileNotFoundError when I run it from another
    directory. Why?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'macuitest'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'explains-working-directory'
    pattern: 'working directory|cwd|__file__|Path'
