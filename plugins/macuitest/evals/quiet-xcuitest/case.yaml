schema_version: "1.0"
name: quiet-xcuitest
description: 'An iOS app, not macOS.'
tags: [should-not-fire]
execution:
  prompt: >-
    How do I tap a button in my iOS app's UI test with XCUITest?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'macuitest'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'uses-xcuitest'
    pattern: 'XCUI'
