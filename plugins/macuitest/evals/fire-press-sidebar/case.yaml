schema_version: "1.0"
name: fire-press-sidebar
description: 'The press-versus-click gotcha.'
tags: [should-fire]
execution:
  prompt: >-
    I ran macuitest press 'System Settings' 'ax(identifier="General")' and it exits 1 saying the element
    offers no press action. What do I do?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-fired'
    tool: 'Skill'
    input_match: 'macuitest'
    min: 1
  - type: 'regex'
    name: 'suggests-click'
    pattern: 'macuitest click|use click|with click|`click`'
