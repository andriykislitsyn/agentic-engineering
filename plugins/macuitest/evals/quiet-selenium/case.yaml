schema_version: "1.0"
name: quiet-selenium
description: 'A web page, not a Mac app.'
tags: [should-not-fire]
execution:
  prompt: >-
    Write a Selenium script that logs into a web page and clicks Submit.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'macuitest'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'uses-selenium'
    pattern: 'Selenium|WebDriver|selenium'
