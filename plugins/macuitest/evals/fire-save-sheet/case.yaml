schema_version: "1.0"
name: fire-save-sheet
description: 'Operating TextEdit from the shell.'
tags: [should-fire]
execution:
  prompt: >-
    On my Mac, from the shell, I need to put the text "hello" into a new TextEdit document and save it
    as notes.txt. The macuitest CLI is installed. How would you do it, step by step?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-fired'
    tool: 'Skill'
    input_match: 'macuitest'
    min: 1
  - type: 'regex'
    name: 'reads-the-tree-or-uses-verbs'
    pattern: 'macuitest (tree|menu|launch|type|set)'
