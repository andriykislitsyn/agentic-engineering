schema_version: "1.0"
name: fire-cd-compound
description: 'The cd-inside-a-compound-command prompt.'
tags: [should-fire]
execution:
  prompt: >-
    I allowed Bash(npm test:*) in my Claude Code settings.json, but every time you run `cd packages/api
    && npm test` it still asks me for permission. Why, and how do I stop it?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-fired'
    tool: 'Skill'
    input_match: 'permission-rules'
    min: 1
  - type: 'regex'
    name: 'suggests-directory-flag'
    pattern: '--prefix|make -C|git -C|directory flag'
