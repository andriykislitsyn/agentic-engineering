schema_version: "1.0"
name: quiet-build-allowlist
description: 'Belongs to the built-in fewer-permission-prompts skill.'
tags: [should-not-fire]
execution:
  prompt: >-
    Go through my recent Claude Code sessions and build me an allowlist of the read-only commands I keep
    approving, so I get fewer permission prompts.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'permission-rules'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'tool_used'
    name: 'routes-to-fewer-permission-prompts'
    tool: 'Skill'
    input_match: 'fewer-permission-prompts'
    min: 1
