schema_version: "1.0"
name: fire-mid-pattern-wildcard
description: 'The :* wildcard only works at the end of a pattern.'
tags: [should-fire]
execution:
  prompt: >-
    I added `Bash(git -C * push:*)` to my Claude Code deny list, but `git -C ../repo push origin main`
    is not blocked. What's wrong with my rule?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-fired'
    tool: 'Skill'
    input_match: 'claude-permissions'
    min: 1
  - type: 'regex'
    name: 'suggests-space-form'
    pattern: '-C \* push \*'
