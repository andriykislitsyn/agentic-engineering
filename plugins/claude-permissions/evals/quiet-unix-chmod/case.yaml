schema_version: "1.0"
name: quiet-unix-chmod
description: 'Unix file permissions, not Claude Code permissions.'
tags: [should-not-fire]
execution:
  prompt: >-
    My deploy.sh script fails with 'permission denied' when I run ./deploy.sh in the terminal. How do I
    fix it?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'claude-permissions'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'suggests-chmod'
    pattern: 'chmod'
