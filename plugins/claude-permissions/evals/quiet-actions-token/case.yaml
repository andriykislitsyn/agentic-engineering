schema_version: "1.0"
name: quiet-actions-token
description: 'GitHub Actions token permissions, not Claude Code permissions.'
tags: [should-not-fire]
execution:
  prompt: >-
    My GitHub Actions workflow fails with 'Resource not accessible by integration' when it tries to
    comment on a pull request. How do I fix the permissions?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'claude-permissions'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'suggests-workflow-permissions'
    pattern: 'pull-requests:\s*write'
