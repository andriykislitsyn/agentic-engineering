schema_version: "1.0"
name: quiet-rename
description: 'A tiny edit with no behavior change needs no testing ceremony.'
tags: [should-not-fire]
execution:
  prompt: |-
    Rename the parameter `x` to `user_id` in this function and show me the result: def load(x): return db.get(x)
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'agentic-testing'
    min: 0
    max: 0
  - type: 'regex'
    name: 'shows-renamed-function'
    pattern: 'def load\(user_id\)'
