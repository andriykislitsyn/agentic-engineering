schema_version: "1.0"
name: quiet-git-reset
description: 'A git question is not a testing task.'
tags: [should-not-fire]
execution:
  prompt: |-
    What is the difference between git reset --soft and git reset --hard?
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: 'tool_used'
    name: 'skill-quiet'
    tool: 'Skill'
    input_match: 'agentic-testing'
    # min defaults to 1, so max alone would demand an impossible 1..0 range.
    min: 0
    max: 0
  - type: 'regex'
    name: 'mentions-working-tree'
    pattern: 'working (tree|directory)'
    flags: i
